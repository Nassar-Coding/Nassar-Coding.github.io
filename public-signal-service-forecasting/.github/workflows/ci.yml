name: CI

# In-project workflow copy for standalone-repository portability. When this
# project is the repository root, GitHub discovers this workflow directly. In
# the monorepo layout the active workflow is the repository-root copy.
#
# CI uses the committed small real-schema sample (USE_SAMPLE_DATA=1) so the
# pipeline runs quickly and reproducibly without the full real dataset. Research
# mode uses the full real NYC 311 2022-2024 data locally.

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      USE_SAMPLE_DATA: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Build processed dataset (sample real-schema mode)
        run: python -m src.build_dataset

      - name: Train models
        run: python -m src.train

      - name: Evaluate models
        run: python -m src.evaluate

      - name: Run decision simulation
        run: python -m src.decision_simulation

      - name: Run monitoring
        run: python -m src.monitor

      - name: Upload reports and figures
        uses: actions/upload-artifact@v4
        with:
          name: forecasting-artifacts
          path: |
            reports/
            figures/
          if-no-files-found: warn
