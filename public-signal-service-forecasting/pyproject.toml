[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-signal-service-forecasting"
version = "0.1.0"
description = "A reproducible public-data ML baseline for service-request forecasting and staffing decision simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Public Signal Service Forecasting Contributors" }]
keywords = [
    "forecasting",
    "operations-management",
    "service-requests",
    "machine-learning",
    "reproducible-research",
]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
download = ["requests>=2.31"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
