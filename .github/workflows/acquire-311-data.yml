# Acquires daily-aggregated 311 data from official city open-data APIs.
# This workflow exists because the research sandbox's network policy blocks
# the Socrata portals directly; GitHub-hosted runners can reach them.
# It commits the acquired raw data (small daily aggregates + provenance
# manifests) back to the branch it ran on.
name: acquire-311-data

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Space-separated city keys to fetch (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: acquire-311-data
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch 311 daily aggregates from official Socrata APIs
        working-directory: dream-paper
        run: |
          python src/acquisition/fetch_311.py \
            --config configs/data_sources.yml \
            --out data/raw/311 \
            ${{ inputs.cities != '' && format('--cities {0}', inputs.cities) || '' }} \
            || echo "ACQUIRE_PARTIAL=1" >> "$GITHUB_ENV"

      - name: Commit acquired data back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dream-paper/data/raw/311
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: acquire 311 daily aggregates via official Socrata APIs [actions]"
            # -X theirs keeps THIS run's freshly acquired files if a parallel
            # run already pushed versions of the same paths
            git pull --rebase -X theirs origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Fail if any city failed
        if: env.ACQUIRE_PARTIAL == '1'
        run: |
          cat dream-paper/data/raw/311/_failures.json || true
          exit 1
