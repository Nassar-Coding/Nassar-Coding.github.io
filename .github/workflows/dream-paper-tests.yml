name: dream-paper-tests

on:
  push:
    branches: [claude/new-session-56q4pt]
    paths: ["dream-paper/src/**", "dream-paper/tests/**", "dream-paper/configs/**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r dream-paper/requirements.txt
      - name: Run unit tests
        working-directory: dream-paper
        run: python -m pytest tests -q
