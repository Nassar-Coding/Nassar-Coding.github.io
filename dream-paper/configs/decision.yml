# Frozen decision-layer protocol (redesign C1-C9; register U1-U10 resolved).
# Every claim-critical value lives here; the guard suite fails if outputs
# disagree with this file. Capacity is ABSTRACT request-equivalent units
# under HYPOTHETICAL service-pressure regimes; nothing here models any
# city's actual staffing, productivity, or queues.

kappa_base: 50.0            # request-equivalents resolvable per capacity unit per day

capacity:
  calibration_primary: train_only        # C1: budgets from training window only
  calibration_sensitivity: train_plus_validation
  regimes:                               # fraction of calibration-window mean daily demand
    scarce: 0.70
    moderate: 0.90
    generous: 1.10

objective:
  primary: equal_weights                 # neutral objective is primary
  sensitivity_normative_weights:         # illustrative, not socially validated
    noise: 1.0
    housing_building: 2.0
    water_sewer: 3.0
    public_safety: 3.0
    streets_transport: 2.0
    sanitation: 2.0
    parks_trees: 1.0
    other: 1.0

service_yield:                           # U7: no unexplained fixed vector
  primary: homogeneous                   # all multipliers = 1.0
  one_family_multipliers: [0.70, 1.30]   # one-family-at-a-time perturbations,
                                         # sensitivity-only, every active family

carryover:
  primary_abandonment: 0.0
  sensitivity_abandonment: 0.10

# U3: Austin `other` — treatment 1 is the PRIMARY analysis (retained, with
# its served fraction and loss share reported separately); treatment 2 is
# the labeled sensitivity below (excluded, budgets recomputed train-only
# over the seven retained families).
austin_other_sensitivity: true

uncertainty_contrast:                    # U5/C5: same fitted model, three representations
  model: lgbm_quantile
  point_arm: q50
  optional_arm: implied_mean
  distribution_arm: full_quantiles
  # U8: quantile model is fit train-only for validation-stage outputs and
  # refit on train+validation for the single test evaluation; it is NEVER
  # a candidate in the point-model selection set.

selection:                               # U1/U8
  candidate_set: point_models_only       # the 11 pre-specified configurations
  headline_rule: validation_only         # test outcomes may not select headlines

inference:                               # U2
  method: paired_moving_block_bootstrap
  block_length_days: 28                  # primary
  block_length_sensitivity: [14, 56]     # pre-specified
  n_resamples: 2000
  seed: 20260609

reference_policy:                        # U6
  name: hindsight_myopic_reference
  is_bound: false
  scope: supplementary_diagnostic_only   # never a bound, denominator, or
                                         # main-text performance target
