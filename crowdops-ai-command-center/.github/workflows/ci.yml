name: CI

# Runs on every push and pull request. No secrets or API keys are required.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The project lives in a subdirectory of the repository.
    defaults:
      run:
        working-directory: crowdops-ai-command-center

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Train model (lifecycle / MLOps step)
        run: python -m src.train

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: crowdops-metrics
          path: crowdops-ai-command-center/reports/metrics.json
          if-no-files-found: error
