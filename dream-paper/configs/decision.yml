# Frozen decision-layer protocol (redesign C1-C9). Every claim-critical value
# lives here; code reads this file and the guard suite fails if outputs
# disagree with it. Capacity is ABSTRACT request-equivalent units under
# HYPOTHETICAL service-pressure regimes; nothing here models any city's
# actual staffing, productivity, or queues.

kappa_base: 50.0            # request-equivalents resolvable per capacity unit per day

capacity:
  calibration_primary: train_only        # C1: budgets from training window only
  calibration_sensitivity: train_plus_validation
  regimes:                               # fraction of calibration-window mean daily demand
    scarce: 0.70
    moderate: 0.90
    generous: 1.10

objective:
  primary: equal_weights                 # 7.6: neutral objective is primary
  sensitivity_normative_weights:         # illustrative, not socially validated
    noise: 1.0
    housing_building: 2.0
    water_sewer: 3.0
    public_safety: 3.0
    streets_transport: 2.0
    sanitation: 2.0
    parks_trees: 1.0
    other: 1.0

service_yield:
  primary: homogeneous                   # 7.7: one request-equivalent base case
  sensitivity_heterogeneous_multipliers: # illustrative only, not observed productivity
    noise: 1.5
    housing_building: 0.7
    water_sewer: 0.8
    public_safety: 0.9
    streets_transport: 1.1
    sanitation: 1.3
    parks_trees: 1.2
    other: 1.0

carryover:
  primary_abandonment: 0.0
  sensitivity_abandonment: 0.10

austin_other_sensitivity: true           # C10: repeat Austin with `other` excluded

uncertainty_contrast:                    # C5: same fitted model, two representations
  model: lgbm_quantile
  point_arm: q50
  optional_arm: implied_mean
  distribution_arm: full_quantiles

inference:
  method: paired_moving_block_bootstrap
  block_length_days: 28
  n_resamples: 2000
  seed: 20260609

reference_policy:
  name: hindsight_myopic_reference       # C6: labeled non-bounding; never a denominator
  is_bound: false
